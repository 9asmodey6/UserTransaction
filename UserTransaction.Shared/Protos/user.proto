syntax = "proto3";

option csharp_namespace = "UserTransaction.ServiceC.Protos";

package user;

service UserService {
  rpc CreateUser (CreateUserRequest) returns (CreateUserReply);
}

message CreateUserRequest {
  string email = 1;
  string username = 2;
}

message CreateUserReply {
  bool success = 1;
  string user_id = 2;
  string error = 3;
}
